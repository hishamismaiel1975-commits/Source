<section>
  <h2 class="text-4xl font-bold text-gray-900">Welcome to My Store</h2>

  <p class="mt-4 max-w-2xl text-lg text-gray-600">
    Discover our latest products and special offers.
  </p>

  <input
    type="text"
    placeholder="Search "
    class="border border-gray-300 bg-blue-100 focus:border focus:outline-none h-8 me-2 px-2"
    [value]="searchText()"
    (input)="searchText.set($any($event.target).value)"
  />
  <button
    type="button"
    class="cursor-pointer rounded-lg bg-blue-600 px-2 py-2 font-semibold text-white hover:bg-blue-500"
    (click)="onSearch()"
  >
    Search
  </button>
</section>
<section class="results">
  <app-products [products]="products().data"></app-products>
  @if (products().count > 0) {
    <h1>Total:{{ products().count }} -- Page No: {{ products().pageIndex }}</h1>
  }
</section>
