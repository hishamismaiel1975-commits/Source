{{- if .Values.apps.catalog.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.apps.catalog.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.apps.catalog.service.type }}

  selector:
    app: {{ .Values.apps.catalog.name }}

  ports:
    - name: http
      port: {{ .Values.apps.catalog.service.port }}
      targetPort: {{ .Values.apps.catalog.service.targetPort }}
      protocol: {{ .Values.apps.catalog.service.protocol }}
      
{{- end }}