{{- if .Values.apps.fileStorage.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.apps.fileStorage.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.apps.fileStorage.name }}

spec:
  replicas: {{ .Values.apps.fileStorage.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.apps.fileStorage.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.apps.fileStorage.name }}

    spec:
      containers:
        - name: {{ .Values.apps.fileStorage.name }}
          image: "{{ .Values.apps.fileStorage.image.repository }}"
          imagePullPolicy: {{ .Values.apps.fileStorage.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-apps-config
                  key: ASPNETCORE_ENVIRONMENT
          
            - name: GrpcSettings__IdentityServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-apps-config
                  key: GrpcSettings__IdentityServiceUrl

            - name: Security__SecretKey
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-apps-config
                  key: Security__SecretKey

            - name: Security__Issuer
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-apps-config
                  key: Security__Issuer

            - name: Security__Audience
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-apps-config
                  key: Security__Audience

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-apps-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          volumeMounts:
            - name: {{ .Values.apps.fileStorage.name }}-data
              mountPath: /app/uploads

          resources:
            requests:
              cpu: {{ .Values.apps.fileStorage.resources.requests.cpu | quote }}
              memory: {{ .Values.apps.fileStorage.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.apps.fileStorage.resources.limits.cpu | quote }}
              memory: {{ .Values.apps.fileStorage.resources.limits.memory | quote }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: {{ .Values.apps.fileStorage.name }}-data
          persistentVolumeClaim:
            claimName: {{ .Values.apps.fileStorage.name }}-pvc
    

{{- end }}