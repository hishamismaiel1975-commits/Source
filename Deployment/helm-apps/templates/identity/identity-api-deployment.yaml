{{- if .Values.identity.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.identity.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.identity.name }}

spec:
  replicas: {{ .Values.identity.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.identity.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.identity.name }}

    spec:
      containers:
        - name: {{ .Values.identity.name }}
          image: {{ .Values.identity.image.repository }} 
          imagePullPolicy: {{ .Values.identity.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
              protocol: TCP
              
            - name: grpc
              containerPort: 81
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.config.ASPNETCORE_ENVIRONMENT }} 

            - name: IdentityDb__ConnectionString
              value: {{ .Values.config.IdentityDb__ConnectionString }}

            - name: GrpcSettings__IdentityServiceUrl
              value: {{ .Values.config.GrpcSettings__IdentityServiceUrl }}
              
            - name: EventBusSettings__HostAddress
              value: {{ .Values.config.EventBusSettings__HostAddress }}

            - name: Security__SecretKey
              value: {{ .Values.config.Security__SecretKey }}

            - name: Security__Issuer
              value: {{ .Values.config.Security__Issuer }}

            - name: Security__Audience
              value: {{ .Values.config.Security__Audience }}

            - name: Security__AccessTokenLifetimeInMinutes
              value: {{ .Values.config.Security__AccessTokenLifetimeInMinutes }}

            - name: Security__RefreshTokenLifetimeInMinutes
              value: {{ .Values.config.Security__RefreshTokenLifetimeInMinutes }}

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.OTEL_EXPORTER_OTLP_ENDPOINT }}

          resources:
            requests:
              cpu: {{ .Values.identity.resources.requests.cpu | quote }}
              memory: {{ .Values.identity.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.identity.resources.limits.cpu | quote }}
              memory: {{ .Values.identity.resources.limits.memory | quote }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5

{{- end }}