{{- if .Values.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  gatewayClassName: approuting-istio
  listeners:
    - name: http
{{ if .Values.ingress.host }}
      hostname: {{ .Values.ingress.host | quote }}
{{ end }}
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
{{- if .Values.ingress.tls.enabled }}
    - name: https
{{ if .Values.ingress.host }}
      hostname: {{ .Values.ingress.host | quote }}
{{ end }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.ingress.tls.secretName | quote }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.name }}
{{ if .Values.ingress.host }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
{{ end }}
  rules:
    {{- range .Values.ingress.paths }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ .service.name }}
          port: {{ .service.port }}
    {{- end }}
{{- end }}
