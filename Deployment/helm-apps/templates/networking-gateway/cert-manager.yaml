{{- if and .Values.gatewaynetworking.enabled .Values.gatewaynetworking.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: {{ .Values.gatewaynetworking.tls.acmeEmail | default "" | quote }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.gatewaynetworking.name }}
                namespace: {{ .Values.global.namespace }}
                kind: Gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ecommerce-tls
  namespace: {{ .Values.global.namespace }}
spec:
  secretName: {{ .Values.gatewaynetworking.tls.secretName }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.gatewaynetworking.host | quote }}
{{- end }}
