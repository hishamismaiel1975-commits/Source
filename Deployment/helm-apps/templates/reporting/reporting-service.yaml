{{- if .Values.reporting.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.reporting.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.reporting.name }}

spec:
  type: ClusterIP

  selector:
    app: {{ .Values.reporting.name }}

  ports:
    - name: http
      port: {{ .Values.reporting.service.port }}
      targetPort: {{ .Values.reporting.service.targetPort }}
      protocol: {{ .Values.reporting.service.protocol }}

{{- end }}