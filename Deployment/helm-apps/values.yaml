global:
  namespace: ecommerce

gateway:
  enabled: true
  name: gateway-api
  replicas: 1

  image:
    repository: ecommercestageregistry.azurecr.io/gateway-api:1.0.5
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: http
    protocol: TCP

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

identity:
  enabled: true
  name: identity-api
  replicas: 1

  image:
    repository: ecommercestageregistry.azurecr.io/identity-api:1.0.1
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: http
    protocol: TCP

  serviceGrpc:
    port: 81
    targetPort: grpc
    protocol: TCP

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

fileStorage:
  enabled: false
  name: filestorage-api
  replicas: 1

  image:
    repository: ecommercestageregistry.azurecr.io/filestorage-api:1.0.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: http
    protocol: TCP

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  persistence:
    size: 100Gi
    storageClass: managed-csi

reporting:
  enabled: false
  name: reporting-api
  replicas: 1

  image:
    repository: ecommercestageregistry.azurecr.io/reporting-api:1.0.1
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: http
    protocol: TCP

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

catalog:
  enabled: true
  name: catalog-api
  replicas: 1

  image:
    repository: ecommercestageregistry.azurecr.io/catalog-api:1.0.1
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: http
    protocol: TCP
  
  serviceGrpc:
    port: 81
    targetPort: grpc
    protocol: TCP

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

client:
  enabled: true
  name: ecommerce-client
  replicas: 1

  image:
    repository: ecommercestageregistry.azurecr.io/client:1.0.1
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: http
    protocol: TCP

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

gatewaynetworking:
  enabled: true
  host: ecommerce.insure
  name: ecommerce-gatewaynetworking
  
  tls:
    enabled: true
    secretName: ecommerce-tls
    acmeEmail: ""

  paths:
    # Angular client
    - path: /
      pathType: Prefix
      service:
        name: ecommerce-client
        port: 80

    # Gateway
    - path: /api
      pathType: Prefix
      service:
        name: gateway-api
        port: 80

config:
  ASPNETCORE_ENVIRONMENT: Staging

  # OTEL_EXPORTER for Grafana OTEL
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  # Security settings
  Security__SecretKey: 879b274c-9cab-4afa-a868-bf5d3038c8d7
  Security__Issuer: "ecommerce.identity"
  Security__Audience: "ecommerce.clients"
  Security__AccessTokenLifetimeInMinutes: "60" # 1 Hour
  Security__RefreshTokenLifetimeInMinutes: "1440" # 24 hours

  # Redis connection string for caching
  RedisSettings__ConnectionString: redis:6379

  # gRPC service URL
  GrpcSettings__IdentityServiceUrl: http://identity-api:81
  GrpcSettings__CatalogServiceUrl: http://catalog-api:81
  
  # Database Connections
  CatalogDb__ConnectionString: Server=tcp:ecommerce-stage-sqldatabase-server.database.windows.net,1433;Initial Catalog=CatalogDB;Persist Security Info=False;User ID=sqladmin1455;Password=sqldb@ecommerce@stage@3561;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
  IdentityDb__ConnectionString: Server=tcp:ecommerce-stage-sqldatabase-server.database.windows.net,1433;Initial Catalog=IdentityDB;Persist Security Info=False;User ID=sqladmin1455;Password=sqldb@ecommerce@stage@3561;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
  
  MongoDB__ConnectionString: mongodb://admin:pass_123456789@mongodb:27017
  FileStorage__DatabaseName: FileStorageDB
  Reporting__DatabaseName: ReportingDB

  # RabbitMQ
  EventBusSettings__HostAddress: amqp://admin:pass_123456789@rabbitmq:5672
