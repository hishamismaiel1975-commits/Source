{{- if .Values.redis.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.redis.name }}

spec:
  type: ClusterIP

  selector:
    app: {{ .Values.redis.name }}

  ports:
    - name: redis
      port:  {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
{{- end }}