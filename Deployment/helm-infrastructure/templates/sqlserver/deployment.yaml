{{- if .Values.sqlserver.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.sqlserver.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.sqlserver.name }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ .Values.sqlserver.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.sqlserver.name }}

    spec:
      containers:
        - name: {{ .Values.sqlserver.name }}
          image: {{ .Values.sqlserver.image.repository }}

          ports:
            - name: sqlserver
              containerPort: {{ .Values.sqlserver.service.port }}
              protocol: TCP

          env:
            - name: ACCEPT_EULA
              value: "Y"

            - name: MSSQL_SA_PASSWORD
              value:  {{ .Values.config.MSSQL_SA_PASSWORD }}
                

          resources:
            {{- toYaml .Values.sqlserver.resources | nindent 12 }}

          volumeMounts:
            - name: {{ .Values.sqlserver.name }}-data
              mountPath: /var/opt/mssql

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >
                  /opt/mssql-tools18/bin/sqlcmd
                  -S localhost
                  -U sa
                  -P "$MSSQL_SA_PASSWORD"
                  -C
                  -Q "SELECT 1"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >
                  /opt/mssql-tools18/bin/sqlcmd
                  -S localhost
                  -U sa
                  -P "$MSSQL_SA_PASSWORD"
                  -C
                  -Q "SELECT 1"
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: {{ .Values.sqlserver.name }}-data
          persistentVolumeClaim:
           claimName: {{ .Values.sqlserver.name }}-pvc

{{- end }}