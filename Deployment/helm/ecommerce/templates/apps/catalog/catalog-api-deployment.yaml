{{- if .Values.apps.catalog.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: { { .Values.apps.catalog.name } }
  namespace: { { .Values.global.namespace } }
  labels:
    app: { { .Values.apps.catalog.name } }

spec:
  replicas: { { .Values.apps.catalog.replicas } }

  selector:
    matchLabels:
      app: { { .Values.apps.catalog.name } }

  template:
    metadata:
      labels:
        app: { { .Values.apps.catalog.name } }

    spec:
      containers:
        - name: { { .Values.apps.catalog.name } }
          image: "{{ .Values.images.registry }}/{{ .Values.apps.catalog.image.repository }}:{{ .Values.apps.catalog.image.tag }}"
          imagePullPolicy: { { .Values.images.catalog.pullPolicy } }

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: CatalogDb__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: CatalogDb__ConnectionString

            - name: RedisSettings__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: RedisSettings__ConnectionString

            - name: GrpcSettings__IdentityServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GrpcSettings__IdentityServiceUrl

            - name: EventBusSettings__HostAddress
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: EventBusSettings__HostAddress

            - name: Security__SecretKey
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__SecretKey

            - name: Security__Issuer
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__Issuer

            - name: Security__Audience
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__Audience

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          resources: { { -toYaml .Values.apps.catalog.resources | nindent 6 } }

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

{{- end }}