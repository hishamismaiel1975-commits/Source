{{- if .Values.apps.client.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: { { .Values.apps.client.name } }
  namespace: { { .Values.global.namespace } }
  labels:
    app: { { .Values.apps.client.name } }
spec:
  replicas: { { .Values.apps.client.replicas } }
  selector:
    matchLabels:
      app: { { .Values.apps.client.name } }
  template:
    metadata:
      labels:
        app: { { .Values.apps.client.name } }
    spec:
      containers:
        - name: { { .Values.apps.client.name } }
          image: "{{ .Values.images.registry }}/{{ .Values.apps.client.image.repository }}:{{ .Values.apps.client.image.tag }}"
          imagePullPolicy: { { .Values.images.catalog.pullPolicy } }
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources: { { -toYaml .Values.apps.catalog.resources | nindent 6 } }

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            
{{- end }}