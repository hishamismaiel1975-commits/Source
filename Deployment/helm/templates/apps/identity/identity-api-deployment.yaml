{{- if .Values.apps.identity.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.apps.identity.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.apps.identity.name }}

spec:
  replicas: {{ .Values.apps.identity.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.apps.identity.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.apps.identity.name }}

    spec:
      containers:
        - name: {{ .Values.apps.identity.name }}
          image: {{ .Values.apps.identity.image.repository }} 
          imagePullPolicy: {{ .Values.apps.identity.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: IdentityDb__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: IdentityDb__ConnectionString

            - name: GrpcSettings__IdentityServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GrpcSettings__IdentityServiceUrl

            - name: EventBusSettings__HostAddress
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: EventBusSettings__HostAddress

            - name: Security__SecretKey
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__SecretKey

            - name: Security__Issuer
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__Issuer

            - name: Security__Audience
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__Audience

            - name: Security__AccessTokenLifetimeInMinutes
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__AccessTokenLifetimeInMinutes

            - name: Security__RefreshTokenLifetimeInMinutes
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__RefreshTokenLifetimeInMinutes

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          resources:
            requests:
              cpu: {{ .Values.apps.identity.resources.requests.cpu | quote }}
              memory: {{ .Values.apps.identity.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.apps.identity.resources.limits.cpu | quote }}
              memory: {{ .Values.apps.identity.resources.limits.memory | quote }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5

{{- end }}