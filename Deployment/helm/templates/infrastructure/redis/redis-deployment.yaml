{{- if .Values.infrastructure.redis.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.infrastructure.redis.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.infrastructure.redis.name }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ .Values.infrastructure.redis.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.infrastructure.redis.name }}

    spec:
      containers:
        - name: {{ .Values.infrastructure.redis.name }}
          image: {{ .Values.infrastructure.redis.image.repository }}

          ports:
            - name: redis
              containerPort: {{ .Values.infrastructure.redis.service.port }}
              protocol: TCP

          resources:
            {{- toYaml .Values.infrastructure.redis.resources | nindent 12 }}

          volumeMounts:
            - name: redis-data
              mountPath: /data

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

{{- end }}