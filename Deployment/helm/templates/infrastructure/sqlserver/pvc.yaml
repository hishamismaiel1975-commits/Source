{{- if .Values.infrastructure.sqlserver.enabled }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.infrastructure.sqlserver.name }}-pvc
  namespace: {{ .Values.global.namespace }}
spec:
  storageClassName:
        {{ .Values.infrastructure.sqlserver.persistence.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.infrastructure.sqlserver.persistence.size }}
      
        

{{- end }}