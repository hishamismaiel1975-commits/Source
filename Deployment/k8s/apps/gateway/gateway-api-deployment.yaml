apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: ecommerce
  labels:
    app: gateway-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: gateway-api

  template:
    metadata:
      labels:
        app: gateway-api

    spec:
      containers:
        - name: gateway-api
          image: gateway-api:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

            - name: internal
              containerPort: 81
              protocol: TCP

          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
