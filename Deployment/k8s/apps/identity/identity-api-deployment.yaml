apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: ecommerce
  labels:
    app: identity-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: identity-api

  template:
    metadata:
      labels:
        app: identity-api

    spec:
      containers:
        - name: identity-api
          image: identity-api:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: IdentityDb__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: IdentityDb__ConnectionString

            - name: GrpcSettings__IdentityServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GrpcSettings__IdentityServiceUrl

            - name: EventBusSettings__HostAddress
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: EventBusSettings__HostAddress

            - name: Security__SecretKey
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__SecretKey

            - name: Security__Issuer
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__Issuer

            - name: Security__Audience
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__Audience

            - name: Security__AccessTokenLifetimeInMinutes
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__AccessTokenLifetimeInMinutes

            - name: Security__RefreshTokenLifetimeInMinutes
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: Security__RefreshTokenLifetimeInMinutes

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
