apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: ecommerce
  labels:
    app: otel-lgtm
spec:
  replicas: 1

  selector:
    matchLabels:
      app: otel-lgtm

  template:
    metadata:
      labels:
        app: otel-lgtm

    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.34.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: grafana
              containerPort: 3000
              protocol: TCP

            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP

            - name: otlp-http
              containerPort: 4318
              protocol: TCP

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"

          volumeMounts:
            - name: otel-lgtm-data
              mountPath: /data

      volumes:
        - name: otel-lgtm-data
          persistentVolumeClaim:
            claimName: otel-lgtm-data
