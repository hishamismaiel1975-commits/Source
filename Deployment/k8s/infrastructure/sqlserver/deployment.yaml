apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: ecommerce
  labels:
    app: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: MSSQL_SA_PASSWORD

          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >
                  /opt/mssql-tools18/bin/sqlcmd
                  -S localhost
                  -U sa
                  -P "$MSSQL_SA_PASSWORD"
                  -C
                  -Q "SELECT 1"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >
                  /opt/mssql-tools18/bin/sqlcmd
                  -S localhost
                  -U sa
                  -P "$MSSQL_SA_PASSWORD"
                  -C
                  -Q "SELECT 1"
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

      volumes:
        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-pvc
