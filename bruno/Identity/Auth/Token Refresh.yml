info:
  name: Token Refresh
  type: http
  seq: 3

http:
  method: POST
  url: http://{{URL}}/identity/api/v1/Auth/token/refresh
  headers:
    - name: Accept-Language
      value: en
  body:
    type: json
    data: '"{{refresh-token}}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
