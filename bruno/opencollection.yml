opencollection: 1.0.0

info:
  name: Ecommerce
config:
  protobuf:
    protoFiles:
      - type: file
        path: ../Services/Identity/Identity.API/GrpcServices/Identity.proto
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{access-token}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
