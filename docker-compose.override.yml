services:
  
  identity.api:
    environment:
     ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
     IdentityDb__ConnectionString: ${IdentityDb__ConnectionString}
     Security__SecretKey: ${Security__SecretKey}
     Security__Issuer: "${Security__Issuer}"
     Security__Audience: "${Security__Audience}"
     Security__AccessTokenLifetimeInMinutes: ${Security__AccessTokenLifetimeInMinutes}    # 1 Hour
     Security__RefreshTokenLifetimeInMinutes: ${Security__RefreshTokenLifetimeInMinutes} # 24 hours
    ports:
       - "8001:80" 

  # report.api:
  #   env_file:
  #     - ./secrets/.env.shared
  #   ports:
  #      - "8002:80" 

  catalog.api:
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      CatalogDb__ConnectionString: ${CatalogDb__ConnectionString}
      RedisSettings__ConnectionString: ${RedisSettings__ConnectionString}
      GrpcSettings__DiscountUrl: ${GrpcSettings__DiscountUrl}
      HttpClient__DiscountUrl: ${HttpClient__DiscountUrl}
      EventBusSettings__HostAddress: ${EventBusSettings__HostAddress}
      Security__SecretKey: ${Security__SecretKey}
      Security__Issuer: "${Security__Issuer}"
      Security__Audience: "${Security__Audience}"
    depends_on:
      mongodb:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8003:80" 

  discount.api:
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      EventBusSettings__HostAddress: ${EventBusSettings__HostAddress}
    ports:
      - "8004:80"  
      - "8104:81"  # gRPC uses HTTP/2; do not expose by gatway. 

  mongodb:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL","mongosh --host localhost --port 27017 -u admin -p pass_123456789 --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "2001:27017"

  sqlserver:
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL","/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'pass_123456789' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "2002:1433"

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d Catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "2003:5432"

  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "2004:15672"

  portainer:
    ports:
      - "2005:9000"
  
  redisinsight:
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "2006:5540"

  

