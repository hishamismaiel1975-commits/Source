services:
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogmongoapi
    restart: always
    build:
      context: .
      dockerfile: Services/Catalog.Mongo/Catalog.API/Dockerfile
    depends_on:
      - mongodb 
      - redis
    environment:
      - ASPNETCORE_HTTP_PORTS=80


  mongodb:
   image: mongo:latest
   restart: always
   volumes:
     - mongo_data:/data/db

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    volumes:
      - sqlserver_data:/var/opt/mssql     
  
  redis:
    image: redis:latest
    restart: always

volumes:
  mongo_data:
  sqlserver_data:
  
  


  